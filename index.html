<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A55">
<title>出張メモ</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#E9EEEA; --paper:#FFFFFF; --ink:#22304A; --sub:#5E6B7E;
  --rule:#B8C8BC; --brand:#2B3A55; --ok:#2E7550; --warn:#A8651A; --bad:#B23A2A;
  --field:#F5F8F5; --r-lg:14px; --r-sm:8px;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151B24;--paper:#1E2633;--ink:#E3E8EF;--sub:#9AA6B8;--rule:#35414F;
  --brand:#8FB0E0;--ok:#6FC195;--warn:#E0A55A;--bad:#EE7C6A;--field:#252F3E;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 16px;letter-spacing:.04em}
h2{font-size:15px;margin:22px 0 8px;color:var(--sub);font-weight:600}
.view{display:none}.view.on{display:block}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kinds button{padding:14px 4px;border:2px solid var(--rule);background:var(--paper);color:var(--ink);
  border-radius:var(--r-lg);font-size:16px;font-weight:700}
.kinds button[aria-pressed=true]{border-color:var(--brand);background:var(--brand);color:var(--paper)}
.kinds.trip{grid-template-columns:1fr 1fr;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.pick{margin-top:14px;display:flex;align-items:center;justify-content:center;min-height:120px;
  border:2px dashed var(--rule);border-radius:var(--r-lg);background:var(--paper);color:var(--sub);text-align:center;padding:12px}
.pick img{max-width:100%;max-height:260px;border-radius:var(--r-sm)}
.primary{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:var(--r-lg);
  background:var(--brand);color:var(--paper);font:inherit;font-weight:700;font-size:17px}
.primary:disabled{opacity:.45}
.ghost{padding:8px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:var(--r-sm);font:inherit;font-size:14px}
.status{margin-top:12px;font-size:14px;color:var(--sub);min-height:1.6em}
.status.err{color:var(--bad)}
.note{padding:10px 12px;border-radius:var(--r-sm);font-size:14px;margin:10px 0;border-left:4px solid}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.note.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--paper))}
.slip{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:4px 12px 12px;margin-top:10px}
.slip .del{float:right;margin-top:8px;color:var(--bad);border-color:transparent;background:transparent}
.yen{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.item .m{font-size:13px;color:var(--sub)}
.item .a{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.item button{grid-column:2;justify-self:end}
.total{display:flex;justify-content:space-between;font-weight:700;padding:12px 0;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);margin-left:6px}
.kinds.four{grid-template-columns:repeat(4,1fr)}
.kinds.four button{font-size:14px;padding:12px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border:1px solid var(--rule);
  border-radius:999px;background:var(--paper);color:var(--ink);font-size:14px}
.chips input{width:auto;margin:0}
.chips label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--paper))}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-top:12px}
.check input{width:auto}
.calc p{margin:6px 0;font-size:14px}
.calc b{font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--sub)}
.empty{color:var(--sub);padding:24px 0;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:14px 0;border:0;background:none;font:inherit;font-size:15px;color:var(--sub)}
nav button[aria-current=page]{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
@media (prefers-reduced-motion:no-preference){#result .slip{animation:in .25s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<main>
  <!-- 読み取り -->
  <section id="v-read" class="view on">
    <h1>出張メモ</h1>
    <p class="sub" id="trip-line"></p>
    <div class="kinds" role="group" aria-label="種類">
      <button data-k="rail" aria-pressed="true">交通</button>
      <button data-k="receipt" aria-pressed="false">レシート</button>
      <button data-k="delivery" aria-pressed="false">宅配</button>
    </div>
    <div class="row2">
      <div><label for="f-date">日付</label><input id="f-date" type="date"></div>
      <div><label for="f-user">利用者</label><input id="f-user" placeholder="自分"></div>
    </div>
    <label class="pick" id="pick">
      <input id="f-img" type="file" accept="image/*" hidden>
      <span id="pick-txt">写真またはスクショを選ぶ</span>
    </label>
    <button class="primary" id="b-read" disabled>読み取る</button>
    <div class="status" id="status" role="status"></div>
    <div id="result"></div>
  </section>

  <!-- 出張 -->
  <section id="v-trip" class="view">
    <h1>出張</h1>
    <div id="trip"></div>
  </section>

  <!-- 保存済み -->
  <section id="v-list" class="view">
    <h1>保存済み</h1>
    <div id="list"></div>
  </section>

  <!-- 設定 -->
  <section id="v-set" class="view">
    <h1>設定</h1>
    <label for="s-key">Gemini APIキー</label>
    <input id="s-key" type="password" autocomplete="off" placeholder="このスマホの中だけに保存されます">
    <div class="tools"><button class="ghost" id="b-keyfile" type="button">ファイルから読み込む</button></div>
    <input id="s-keyfile" type="file" hidden>
    <label for="s-model">モデル</label>
    <input id="s-model">
    <label for="s-inputter">入力者（スプレッドシートでの識別用。人名以外の記号で）</label>
    <input id="s-inputter" placeholder="例：A">
    <label for="s-sheet">スプレッドシートのURL</label>
    <input id="s-sheet" placeholder="https://docs.google.com/spreadsheets/d/…">
    <label for="s-client">GoogleログインのクライアントID</label>
    <input id="s-client">
    <label for="s-user">利用者の初期値</label>
    <input id="s-user" placeholder="例：自分">
    <label for="s-fare">交通費に使う運賃</label>
    <select id="s-fare"><option value="ic">IC運賃</option><option value="ticket">切符運賃</option></select>
    <label for="s-round">「往復」の行の金額</label>
    <select id="s-round"><option value="double">往復の合計（片道×2）</option><option value="single">片道のまま</option></select>
    <button class="primary" id="b-save-set">設定を保存</button>
    <div class="status" id="set-status" role="status"></div>
  </section>
</main>

<nav>
  <button data-v="trip">出張</button>
  <button data-v="read" aria-current="page">読み取り</button>
  <button data-v="list">保存済み</button>
  <button data-v="set">設定</button>
</nav>

<script>
// ============================================================
// 保存領域（このスマホのブラウザ内）
// ============================================================
const KEY_SET = 'tm.settings', KEY_ITEMS = 'tm.items';
const DEFAULTS = { key:'', model:'gemini-3.5-flash', user:'自分', fare:'ic', round:'double', inputter:'A',
  sheet:'14G7x4DYTg5xmR_n-Rt6u_sT7XKpxusCmOuDz2rhhtes',
  client:'151097085526-rgsi13mlttqtm0ettenhnv50sg89fdc9.apps.googleusercontent.com' };

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

let settings = Object.assign({}, DEFAULTS, load(KEY_SET, {}));
let items = load(KEY_ITEMS, []);
let kind = 'rail';
let imageData = null;   // { mime, b64 }
let pending = [];       // 確認中の行
let check = null;       // 交通費の照合結果

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => (Number(n) || 0).toLocaleString('ja-JP');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

// ============================================================
// 画面切り替え
// ============================================================
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.removeAttribute('aria-current'));
  b.setAttribute('aria-current', 'page');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + b.dataset.v).classList.add('on');
  if (b.dataset.v === 'list') renderList();
  if (b.dataset.v === 'trip') renderTrip();
  if (b.dataset.v === 'read') renderTripLine();
  if (b.dataset.v === 'set') fillSettings();
});

document.querySelectorAll('.kinds button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.kinds button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  kind = b.dataset.k;
});

$('#f-date').value = today();
$('#f-user').value = settings.user;

// ============================================================
// 設定
// ============================================================
function fillSettings(){
  $('#s-key').value = settings.key; $('#s-model').value = settings.model;
  $('#s-user').value = settings.user; $('#s-fare').value = settings.fare; $('#s-round').value = settings.round;
  $('#s-inputter').value = settings.inputter; $('#s-sheet').value = settings.sheet; $('#s-client').value = settings.client;
}
// キーファイル（中身がキーそのもの、または GEMINI_API_KEY=xxx の形式）を読み込む
$('#b-keyfile').onclick = () => $('#s-keyfile').click();
$('#s-keyfile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const t = await f.text();
  const m = t.match(/GEMINI_API_KEY\s*=\s*["']?([^"'\s]+)/);
  const k = m ? m[1] : (t.split(/\r?\n/).map(s => s.trim()).find(s => s) || '');
  e.target.value = '';
  if (!k) { $('#set-status').textContent = 'ファイルが空でした。'; return; }
  $('#s-key').value = k;
  $('#set-status').textContent = 'キーを読み込みました。「設定を保存」を押すと保存されます。';
};
$('#b-save-set').onclick = () => {
  settings = { trip:settings.trip, key:$('#s-key').value.trim(), model:$('#s-model').value.trim() || DEFAULTS.model,
    user:$('#s-user').value.trim(), fare:$('#s-fare').value, round:$('#s-round').value,
    inputter:$('#s-inputter').value.trim() || DEFAULTS.inputter,
    sheet:sheetId($('#s-sheet').value) || DEFAULTS.sheet, client:$('#s-client').value.trim() || DEFAULTS.client };
  $('#set-status').textContent = store(KEY_SET, settings) ? '保存しました。' : '保存できませんでした。ブラウザの保存領域を確認してください。';
  $('#f-user').value = settings.user;
};

// ============================================================
// 画像の読み込み（長辺2400pxまで縮小してJPEG化）
// ============================================================
$('#f-img').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.9);
  imageData = { mime:'image/jpeg', b64:url.split(',')[1] };
  $('#pick-txt').innerHTML = '<img alt="選んだ画像" src="' + url + '">';
  $('#b-read').disabled = false;
};

// ============================================================
// Gemini 呼び出し
// ============================================================
async function gemini(parts, { json = true, search = false } = {}){
  if (!settings.key) throw new Error('APIキーが未設定です。「設定」で入力してください。');
  const body = { contents:[{ parts }], generationConfig:{ temperature:0 } };
  if (json) body.generationConfig.responseMimeType = 'application/json';
  if (search) body.tools = [{ google_search:{} }];
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(settings.model) + ':generateContent', {
    method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':settings.key }, body:JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('Gemini エラー（' + res.status + '）：' + (data.error?.message || '応答なし'));
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!text) throw new Error('Gemini から結果が返りませんでした。画像を変えて再度お試しください。');
  return parseJson(text);
}
function parseJson(t){
  const s = t.replace(/^```(json)?\s*/i, '').replace(/\s*```$/, '').trim();
  try { return JSON.parse(s); } catch(e){}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch(e){} }
  throw new Error('読み取り結果を解釈できませんでした。もう一度お試しください。');
}
const img = () => ({ inline_data:{ mime_type:imageData.mime, data:imageData.b64 } });
const num = v => { if (v === null || v === undefined || v === '') return null;
  const n = Number(String(v).replace(/[,円\s]/g, '')); return isFinite(n) ? Math.round(n) : null; };

// 会社名の表記を精算書に合わせる
function normPayee(s){
  return String(s || '').trim()
    .replace(/株式会社|\(株\)|（株）/g, '㈱').replace(/有限会社|\(有\)|（有）/g, '㈲');
}

// ============================================================
// 交通（経路スクショ）
// ============================================================
const RAIL_PROMPT = `この画像は乗換案内（Googleマップ等）の経路検索結果のスクリーンショットです。
実際に電車・バスに乗っている区間だけを、乗車順に抽出してください。徒歩・乗り換え待ちは含めません。

- company：運行会社名。路線名から補完する（例：JR山手線→JR東日本、西武新宿線→西武鉄道、東京メトロ日比谷線→東京メトロ）
- from / to：画像に表示された駅名（末尾の「駅」は付けない）
- 同じ会社でも乗換駅で区切れている場合は別の区間として出力
- totalIcPrice：画面に「IC」付きで表示された経路全体の総額。totalTicketPrice：IC表記のない総額。表示がなければ null
- 区間ごとの料金は推測しない。総額も推測しない

次のJSONのみを返してください。
{"totalIcPrice":null,"totalTicketPrice":null,"segments":[{"company":"","from":"","to":""}]}`;

function mergeSegments(segs){
  const out = [];
  for (const s of segs || []) {
    let co = String(s.company || '').trim();
    if (/^JR/.test(co)) co = 'JR';
    const last = out[out.length - 1];
    if (last && last.company === co) last.to = s.to;
    else out.push({ company:co, from:s.from, to:s.to });
  }
  return out;
}

async function readRail(){
  setStatus('経路を読み取っています…');
  const r = await gemini([{ text:RAIL_PROMPT }, img()]);
  const segs = mergeSegments(r.segments);
  if (!segs.length) throw new Error('乗車区間が見つかりませんでした。経路の詳細が写った画面で試してください。');
  const useIc = settings.fare === 'ic';
  const imageTotal = num(useIc ? r.totalIcPrice : r.totalTicketPrice) ?? num(useIc ? r.totalTicketPrice : r.totalIcPrice);

  let fares;
  if (segs.length === 1 && imageTotal !== null) {
    // 会社が1社だけなら画面の総額をそのまま使う（検索不要）
    fares = [imageTotal];
    check = { type:'ok', text:'画面の総額 ' + yen(imageTotal) + '円をそのまま使いました。' };
  } else {
    setStatus('区間ごとの運賃を調べています…');
    const q = segs.map((s, i) => (i + 1) + '. ' + s.company + '：' + s.from + ' → ' + s.to).join('\n');
    const f = await gemini([{ text:`次の各区間の現在の普通運賃（大人1名・片道）を、鉄道会社の公式情報を優先して調べてください。
特急料金・指定席料金・割引は含めません。JRは指定された区間の通し運賃です。分からない値は null にし、推測で作らないでください。

${q}

次のJSONのみを返してください。
{"fares":[{"no":1,"icPrice":null,"ticketPrice":null}]}` }], { json:false, search:true });
    fares = segs.map((s, i) => {
      const x = (f.fares || []).find(v => Number(v.no) === i + 1) || {};
      return num(useIc ? x.icPrice : x.ticketPrice) ?? num(useIc ? x.ticketPrice : x.icPrice);
    });
    const sum = fares.reduce((a, b) => a + (b || 0), 0);
    if (imageTotal === null) check = { type:'warn', text:'画面に総額がないため、検索した運賃です。金額を確認してください。' };
    else if (sum === imageTotal && fares.every(v => v !== null)) check = { type:'ok', text:'区間の合計 ' + yen(sum) + '円が画面の総額と一致しました。' };
    else check = { type:'warn', text:'区間の合計 ' + yen(sum) + '円が画面の総額 ' + yen(imageTotal) + '円と一致しません。金額を確認してください。' };
  }

  pending = segs.map((s, i) => ({
    kind:'rail', date:$('#f-date').value, user:$('#f-user').value.trim(),
    payee:s.company, c1:s.from, c2:s.to, kubun:'片道', base:fares[i], amount:fares[i] ?? '', note:''
  }));
}

// ============================================================
// レシート・領収書
// ============================================================
const RECEIPT_PROMPT = `この画像は経費精算に使う領収書・レシート・利用証明書です。必要な情報を抽出してください。

【金額】totalPaidAmount は実際に支払った税込総額のみ。「合計」「お支払額」「領収金額」などから判断する。
税抜額・小計・消費税額・税率別対象額・値引き前・お預かり・お釣りは使わない。推測しない。
【日付】receiptDate は利用日・購入日を YYYY-MM-DD で。読めなければ null。
【支払先】payee は販売した会社名・法人名を優先し、店舗名・支店名は付けない（例：「コープみらい 東村山駅前店」→「コープみらい」）。
会社名が読めず店舗名だけなら店舗名。宛名・担当者名は支払先ではない。創作しない。
【商品】items は読み取れた商品名・サービス名の配列。
【種類】expenseType は次を優先：ガソリン／駐車場／新幹線／熱中症対策／漁具餌。どれでもなければ読み取れた内容を短く。
熱中症対策：飲料、スポーツドリンク、経口補水液、塩分補給、冷却用品、保冷剤など。商品名で判断できなければ無理に決めない。
漁具餌：ミミズ、イソメ、ゴカイ、練り餌、釣り餌、釣具、漁具など。店の種類ではなく商品で判断する。
【新幹線】分かれば departureStation、arrivalStation、personCount（複数人数分が明確なときのみ）。

次のJSONのみを返してください。
{"receiptDate":null,"payee":"","totalPaidAmount":null,"expenseType":"","items":[],"departureStation":"","arrivalStation":"","personCount":null}`;

const CONTENT_RULES = [
  { words:['ガソリン','給油','燃料','軽油','レギュラー','ハイオク','ディーゼル'], result:'ガソリン代' },
  { words:['駐車場','コインパーキング','パーキング','駐車料'], result:'駐車場' },
  { words:['新幹線'], result:'SHINKANSEN' },
  { words:['熱中症','経口補水液','スポーツドリンク','塩分補給','塩タブレット','塩飴','冷却','保冷剤'], result:'熱中症対策' },
  { words:['ミミズ','イソメ','ジャリメ','ゴカイ','練り餌','練餌','餌','エサ','釣具','釣り具','漁具','カゴ網','かご網'], result:'漁具餌' }
];
function decideContent(r){
  const type = String(r.expenseType || '').trim();
  if (type === '熱中症対策') return '熱中症対策';
  const text = [r.payee, type, r.departureStation, r.arrivalStation, (r.items || []).join(' ')].join(' ');
  for (const rule of CONTENT_RULES) {
    if (rule.words.some(w => text.includes(w))) {
      if (rule.result !== 'SHINKANSEN') return rule.result;
      const a = String(r.departureStation || '').replace(/駅$/, ''), b = String(r.arrivalStation || '').replace(/駅$/, '');
      return a && b ? '新幹線（' + a + '→' + b + '）' : '新幹線';
    }
  }
  return type || '経費';
}

async function readReceipt(){
  setStatus('レシートを読み取っています…');
  const r = await gemini([{ text:RECEIPT_PROMPT }, img()]);
  const amount = num(r.totalPaidAmount);
  const content = decideContent(r);
  const persons = parseInt(String(r.personCount ?? '').replace(/[名人]/g, ''), 10);
  const note = content.startsWith('新幹線') && persons >= 2 ? persons + '名分' : '';
  check = amount === null ? { type:'warn', text:'金額を読み取れませんでした。入力してください。' } : null;
  pending = [{
    kind:'receipt', date:r.receiptDate || $('#f-date').value, user:$('#f-user').value.trim(),
    payee:normPayee(r.payee), c1:content, c2:'', kubun:'', base:null, amount:amount ?? '', note
  }];
}

// スプレッドシート連携
// ============================================================
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const SHEET = '明細';
const HEADERS = ['明細ID','出張ID','入力者','日付','利用者','種別','支払先','内容1','内容2','区分','金額','備考','出力済','登録日時'];
const KIND_LABEL = { rail:'交通', receipt:'レシート', delivery:'宅配' };
let token = load('tm.token', null);

function sheetId(v){ const m = String(v || '').match(/\/d\/([\w-]+)/); return m ? m[1] : String(v || '').trim(); }
function listStatus(t){ ['#list-status', '#trip-status'].forEach(id => { const s = $(id); if (s) s.textContent = t; }); }

function withToken(fn){
  if (token && token.exp > Date.now() + 60000) return fn(token.v);
  if (!window.google || !google.accounts || !google.accounts.oauth2) { listStatus('Googleログインの準備中です。数秒待ってからもう一度押してください。'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id:settings.client, scope:SCOPE,
    callback:r => {
      if (r.error) { listStatus('ログインできませんでした（' + r.error + '）。'); return; }
      token = { v:r.access_token, exp:Date.now() + r.expires_in * 1000 };
      store('tm.token', token); fn(token.v);
    },
    error_callback:() => listStatus('ログインが中断されました。もう一度押してください。')
  });
  client.requestAccessToken();
}

async function sheets(path, tok, method = 'GET', body){
  const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + settings.sheet + path, {
    method, headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body:body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { token = null; store('tm.token', null); throw new Error('ログインの期限が切れました。もう一度押してください。'); }
  if (!res.ok) throw new Error('スプレッドシートのエラー（' + res.status + '）：' + (data.error?.message || '応答なし'));
  return data;
}

async function ensureSheet(tok, title = SHEET, headers = HEADERS){
  const meta = await sheets('?fields=sheets.properties.title', tok);
  if (!(meta.sheets || []).some(x => x.properties.title === title))
    await sheets(':batchUpdate', tok, 'POST', { requests:[{ addSheet:{ properties:{ title } } }] });
  const head = await sheets('/values/' + encodeURIComponent(title + '!A1:Z1'), tok);
  if (!head.values || !head.values.length)
    await sheets('/values/' + encodeURIComponent(title + '!A1') + '?valueInputOption=RAW', tok, 'PUT', { values:[headers] });
}

// 指定した出張IDの行だけを入れ替える（A列＝出張ID）
async function replaceRows(tok, title, headers, tripId, rows){
  await ensureSheet(tok, title, headers);
  const cur = await sheets('/values/' + encodeURIComponent(title + '!A2:Z'), tok);
  const keep = (cur.values || []).filter(r => r[0] !== tripId);
  await sheets('/values/' + encodeURIComponent(title + '!A2:Z') + ':clear', tok, 'POST', {});
  const all = keep.concat(rows);
  if (all.length)
    await sheets('/values/' + encodeURIComponent(title + '!A2') + '?valueInputOption=USER_ENTERED', tok, 'PUT', { values:all });
}

async function sendItems(tok){
  const targets = items.filter(p => !p.sent);
  if (!targets.length) return;
  $('#b-send').disabled = true; listStatus('送信しています…');
  try {
    await ensureSheet(tok);
    const rows = targets.map(p => [p.id, p.tripId || '', settings.inputter, p.date, p.user, KIND_LABEL[p.kind] || p.kind,
      p.payee, p.c1, p.c2 || '', p.kubun || '', p.amount, p.note || '', false,
      (p.createdAt || '').replace('T', ' ').slice(0, 16)]);
    await sheets('/values/' + encodeURIComponent(SHEET + '!A1') + ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS',
      tok, 'POST', { values:rows });
    targets.forEach(p => p.sent = true); store(KEY_ITEMS, items);
    renderList(); listStatus(rows.length + '件を送信しました。');
  } catch(e) { $('#b-send').disabled = false; listStatus(e.message); }
}

  if (logType === '走行') f = `<label for="l-route">走行ルート概略</label><input id="l-route" placeholder="例：レンタカー店→IC→宿">
    <div class="row2">
      <div><label for="l-km">距離（km）</label><input id="l-km" type="number" min="0" inputmode="decimal"></div>
      <div><label for="l-driver">運転者（社員）</label><select id="l-driver">${t.emp.map(m => `<option>${esc(m)}</option>`).join('')}</select></div>
    </div>
    ${t.vehicle === 'レンタカー＆自家用車' ? `<label for="l-car">車両</label><select id="l-car"><option>レンタカー</option><option>自家用車</option></select>` : ''}`;
  return `<h2>記録を追加</h2>
  <div class="kinds four" role="group" aria-label="記録の種類">${LOG_TYPES.map(x =>
    `<button data-lt="${x}" aria-pressed="${x === logType}">${x}</button>`).join('')}</div>
  <label for="l-date">日付</label>
  <select id="l-date">${dates.map(d => `<option value="${d}" ${d === logDate ? 'selected' : ''}>${md(d)}${d < t.start ? '（前日）' : ''}</option>`).join('')}</select>
  ${f}
  <button class="primary" id="l-add">記録を追加</button>`;
}

function logText(l){
  const mem = (l.members || []).join('、');
  if (l.type === '前日入り') return mem + '　' + l.move + (l.start ? '　' + l.start + '集合' : '') + (l.place ? '（' + l.place + '）' : '');
  if (l.type === '基本調査') return mem + '　' + l.start + '〜' + l.end + (l.half ? '　半日' : '');
  if (l.type === '時間外') return mem + '　' + (l.start ? l.start + '〜' + l.end + '　' : '') + l.work + '時間';
  return (l.route || '') + '　' + l.km + 'km　運転：' + l.driver + (l.car ? '　' + l.car : '');
}

function logList(t){
  if (!t.logs.length) return '<p class="empty">まだ記録がありません。</p>';
  const sorted = t.logs.slice().sort((a, b) => a.date.localeCompare(b.date) || LOG_TYPES.indexOf(a.type) - LOG_TYPES.indexOf(b.type));
  return '<h2>記録</h2>' + sorted.map(l => `<div class="item">
    <div>${esc(md(l.date))}　${esc(l.type)}<div class="m">${esc(logText(l))}</div></div>
    <button class="ghost" data-log="${esc(l.id)}">削除</button></div>`).join('');
}

function calcTrip(t){
  const days = {}, ot = {}, pre = {}, dayKm = {}, cars = {}, drive = {};
  for (const l of t.logs) {
    for (const m of l.members || []) {
      if (l.type === '基本調査') (days[m] = days[m] || new Set()).add(l.date);
      if (l.type === '時間外') ot[m] = (ot[m] || 0) + (Number(l.work) || 0);
      if (l.type === '前日入り') (pre[m] = pre[m] || []).push(md(l.date) + ' ' + l.move);
    }
    if (l.type === '走行') {
      const k = l.date + '|' + l.driver; dayKm[k] = (dayKm[k] || 0) + (Number(l.km) || 0);
      const c = l.car || t.vehicle; cars[c] = cars[c] || { km:0, dates:new Set() };
      cars[c].km += Number(l.km) || 0; if (Number(l.km) > 0) cars[c].dates.add(l.date);
    }
  }
  for (const [k, km] of Object.entries(dayKm)) {
    const tier = km >= 350 ? 2 : km >= 250 ? 1 : km >= 150 ? 0 : -1;
    if (tier >= 0) { const d = k.split('|')[1]; (drive[d] = drive[d] || [0, 0, 0])[tier]++; }
  }
  return { days, ot, pre, drive, cars };
}

function tripCalc(t){
  const c = calcTrip(t), line = (a, b) => `<p>${a}　<b>${b}</b></p>`;
  let h = '<h2>集計の目安</h2><div class="slip calc">';
  const dd = Object.entries(c.days);
  h += '<p class="sub">通常日当（基本調査の日数）</p>' + (dd.length ? dd.map(([m, s]) => line(esc(m), s.size + '日')).join('') : '<p>なし</p>');
  const oo = Object.entries(c.ot);
  h += '<p class="sub">時間外日当（作業時間の合計）</p>' + (oo.length ? oo.map(([m, v]) => line(esc(m), v + '時間')).join('') : '<p>なし</p>');
  const pp = Object.entries(c.pre);
  if (pp.length) h += '<p class="sub">前日入り（日当への反映方法は未確定）</p>' + pp.map(([m, v]) => line(esc(m), esc(v.join('、')))).join('');
  const PRICE = [400, 800, 1200], LABEL = ['150〜250km', '250〜350km', '350km以上'];
  const dr = Object.entries(c.drive);
  h += '<p class="sub">運転手当</p>' + (dr.length ? dr.map(([m, n]) => line(esc(m),
    n.map((x, i) => x ? LABEL[i] + '×' + x + '日' : '').filter(Boolean).join('、') + '　' + yen(n.reduce((a, x, i) => a + x * PRICE[i], 0)) + '円')).join('') : '<p>対象なし</p>');
  h += '<p class="sub">車両費</p>';
  const rent = c.cars['レンタカー'], own = c.cars['自家用車'];
  if (!rent && !own) h += '<p>走行の記録なし</p>';
  if (rent) {
    const n = rent.dates.size, rate = t.cc === 'under' ? 10 : 12;
    const loss = Math.max(rate * rent.km, 4000 * n), ins = Math.max(3 * rent.km, 400 * n);
    h += line('レンタカー ' + yen(rent.km) + 'km・' + n + '日', yen(loss + ins) + '円') +
      `<p class="sub">車損料 ${yen(loss)}円（${rate}円×km と 4,000円×日数の高い方）＋保険料 ${yen(ins)}円（3円×km と 400円×日数の高い方）</p>`;
  }
  if (own) h += line('自家用車 ' + own.dates.size + '日', yen(6000 * own.dates.size) + '円');
  return h + '</div>';
}

function bindTrip(t, mode){
  const sel = $('#t-sel');
  if (sel) sel.onchange = () => { settings.trip = sel.value; store(KEY_SET, settings); tripMode = null; renderTrip(); };
  const nb = $('#t-new'); if (nb) nb.onclick = () => { tripMode = 'new'; renderTrip(); };
  if (mode) {
    const cb = $('#t-cancel'); if (cb) cb.onclick = () => { tripMode = null; renderTrip(); };
    $('#t-save').onclick = () => {
      const v = { start:$('#t-start').value, end:$('#t-end').value, vehicle:$('#t-veh').value, cc:$('#t-cc').value,
        advance:num($('#t-adv').value) ?? '', emp:codes($('#t-emp').value), pt:codes($('#t-pt').value) };
      if (!v.start || !v.end || v.start > v.end) return tStatus('開始日と終了日を確認してください。', true);
      if (!v.emp.length) return tStatus('社員を1人以上入力してください。', true);
      if (mode === 'edit') Object.assign(t, v, { sent:false });
      else {
        const id = 'T' + v.start.replace(/-/g, '') + '-' + (settings.inputter || 'A') + '-' + Math.random().toString(36).slice(2, 6);
        trips.push(Object.assign({ id, logs:[], sent:false }, v)); settings.trip = id; store(KEY_SET, settings);
      }
      if (!saveTrips()) return tStatus('保存できませんでした。ブラウザの保存領域を確認してください。', true);
      tripMode = null; renderTrip(); tStatus(mode === 'edit' ? '変更を保存しました。' : '出張を登録しました。');
    };
    return;
  }
  $('#t-edit').onclick = () => { tripMode = 'edit'; renderTrip(); };
  $('#l-date').onchange = e => logDate = e.target.value;
  document.querySelectorAll('[data-lt]').forEach(b => b.onclick = () => { logType = b.dataset.lt; renderTrip(); });
  if (logType === '時間外') {
    const auto = () => { const a = toMin($('#l-start').value), b = toMin($('#l-end').value);
      if (a !== null && b !== null) $('#l-work').value = ((b - a + 1440) % 1440) / 60; };
    $('#l-start').onchange = auto; $('#l-end').onchange = auto;
  }
  $('#l-add').onclick = () => addLog(t);
  document.querySelectorAll('[data-log]').forEach(b => b.onclick = () => {
    if (!confirm('この記録を削除しますか？')) return;
    t.logs = t.logs.filter(l => l.id !== b.dataset.log); t.sent = false; saveTrips(); renderTrip();
  });
  $('#t-send').onclick = () => withToken(tok => sendTrip(tok, t));
}

function addLog(t){
  const l = { id:crypto.randomUUID(), date:$('#l-date').value, type:logType };
  logDate = l.date;
  if (logType !== '走行') {
    l.members = [...document.querySelectorAll('#l-mem input:checked')].map(i => i.value);
    if (!l.members.length) return tStatus('メンバーを1人以上選んでください。', true);
  }
  if (logType === '前日入り') Object.assign(l, { move:$('#l-move').value, start:$('#l-time').value, place:$('#l-place').value.trim() });
  if (logType === '基本調査') {
    Object.assign(l, { start:$('#l-start').value, end:$('#l-end').value, half:$('#l-half').checked });
    if (!l.start || !l.end) return tStatus('開始と終了の時刻を入力してください。', true);
  }
  if (logType === '時間外') {
    Object.assign(l, { start:$('#l-start').value, end:$('#l-end').value, work:Number($('#l-work').value) });
    if (!(l.work > 0)) return tStatus('作業時間を入力してください。', true);
  }
  if (logType === '走行') {
    Object.assign(l, { route:$('#l-route').value.trim(), km:Number($('#l-km').value), driver:$('#l-driver').value });
    if ($('#l-car')) l.car = $('#l-car').value;
    if (!(l.km > 0)) return tStatus('距離を入力してください。', true);
    if (!l.driver) return tStatus('運転者にする社員を出張に登録してください。', true);
  }
  t.logs.push(l); t.sent = false;
  if (!saveTrips()) return tStatus('保存できませんでした。', true);
  renderTrip(); tStatus(md(l.date) + 'の' + l.type + 'を追加しました。');
}

async function sendTrip(tok, t){
  $('#t-send').disabled = true; tStatus('送信しています…');
  try {
    await replaceRows(tok, '出張', ['出張ID','入力者','開始日','終了日','使用車両','排気量','仮払金','社員','アルバイト','更新日時'], t.id,
      [[t.id, settings.inputter, t.start, t.end, t.vehicle, t.cc === 'under' ? '1800cc未満' : '1800cc以上', t.advance, t.emp.join(','), t.pt.join(','), nowText()]]);
    await replaceRows(tok, '勤務', ['出張ID','日付','種類','メンバー','開始','終了','移動','集合場所','半日','作業時間'], t.id,
      t.logs.filter(l => l.type !== '走行').map(l => [t.id, l.date, l.type, l.members.join(','), l.start || '', l.end || '',
        l.move || '', l.place || '', l.half ? '○' : '', l.type === '時間外' ? l.work : '']));
    await replaceRows(tok, '走行', ['出張ID','日付','ルート','距離km','運転者','車両'], t.id,
      t.logs.filter(l => l.type === '走行').map(l => [t.id, l.date, l.route || '', l.km, l.driver, l.car || t.vehicle]));
    t.sent = true; saveTrips(); renderTrip(); tStatus('送信しました。');
  } catch(e) { $('#t-send').disabled = false; tStatus(e.message, true); }
}

renderTripLine();

if (!settings.key) setStatus('最初に「設定」でGemini APIキーを入力してください。');
</script>
